<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Streak Reversal — Trade Visualizer</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e0e10; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
  #topbar { background: #1a1a1d; padding: 10px 14px; border-bottom: 1px solid #2a2a2e;
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  #topbar label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #999; }
  #topbar input, #topbar select { background: #0e0e10; color: #e6e6e6;
    border: 1px solid #333; padding: 5px 8px; border-radius: 3px; width: 100px; }
  #topbar input[type=file] { width: auto; }
  #topbar button { background: #4caf50; color: #0e0e10; border: 0; padding: 8px 18px;
    border-radius: 3px; font-weight: 700; cursor: pointer; }
  #topbar button:hover { background: #5dd462; }
  #main { display: flex; height: calc(100vh - 92px); }
  #chart-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chart { flex: 1; min-height: 0; }
  #equity-chart { height: 180px; border-top: 1px solid #2a2a2e; }
  #side { width: 340px; background: #131316; border-left: 1px solid #2a2a2e;
    display: flex; flex-direction: column; overflow: hidden; }
  #stats { padding: 12px 14px; border-bottom: 1px solid #2a2a2e;
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.6; }
  #stats .row { display: flex; justify-content: space-between; }
  #stats .row span:first-child { color: #888; }
  #stats h3 { margin: 0 0 8px 0; font-size: 13px; color: #4caf50; }
  #trade-list { flex: 1; overflow-y: auto; }
  .trade-row { padding: 8px 14px; border-bottom: 1px solid #1f1f23; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; }
  .trade-row:hover { background: #1c1c20; }
  .trade-row.active { background: #2a2a3a; border-left: 3px solid #42a5f5; padding-left: 11px; }
  .trade-row .dir { width: 18px; font-weight: 700; }
  .trade-row .dir.long { color: #4caf50; }
  .trade-row .dir.short { color: #ef5350; }
  .trade-row .pnl { font-family: ui-monospace, monospace; font-weight: 600; }
  .trade-row .pnl.win { color: #4caf50; }
  .trade-row .pnl.loss { color: #ef5350; }
  .trade-row .meta { color: #777; font-size: 10.5px; }
  #status { padding: 6px 14px; color: #888; font-size: 11px;
    background: #1a1a1d; border-top: 1px solid #2a2a2e; }
</style>
</head>
<body>

<div id="topbar">
  <label>Data file <input type="file" id="file-input" accept=".json"></label>
  <label>Streak <input type="number" id="streak" value="5" min="2"></label>
  <label>TP after <input type="number" id="tp" value="2" min="1"></label>
  <label>SL (pts) <input type="number" id="sl" value="16" step="0.5"></label>
  <label>Slippage <input type="number" id="slip" value="0.3" step="0.1"></label>
  <label>Comm /lot <input type="number" id="comm" value="0.8" step="0.1"></label>
  <label>Mode
    <select id="mode">
      <option value="flat">Flat risk</option>
      <option value="scaling">Scaling</option>
    </select>
  </label>
  <label>Flat $ <input type="number" id="flat" value="10" step="1"></label>
  <label>Start bal <input type="number" id="start-bal" value="1000" step="100"></label>
  <label>Risk/$100 <input type="number" id="risk100" value="1" step="0.1"></label>
  <label>TP fill
    <select id="tpfill">
      <option value="close">Bar close (Python parity)</option>
      <option value="nextopen">Next bar open (live-realistic)</option>
    </select>
  </label>
  <button id="run">Run Backtest</button>
</div>

<div id="main">
  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="equity-chart"></div>
  </div>
  <div id="side">
    <div id="stats"><h3>STATS</h3><div class="row"><span>load data + click Run</span><span></span></div></div>
    <div id="trade-list"></div>
  </div>
</div>
<div id="status">no data loaded</div>

<script>
// =========================================================
// STATE
// =========================================================
let bars = [];
let chartTimes = [];
let result = null;
let activeTradeIdx = -1;

let entryLineSeries = null;
let slLineSeries = null;
let tradeSegSeries = null;

// =========================================================
// CHARTS
// =========================================================
const chartEl = document.getElementById('chart');
const equityEl = document.getElementById('equity-chart');

const baseChartOpts = {
  layout: { background: { color: '#0e0e10' }, textColor: '#bbb' },
  grid: { vertLines: { color: '#1c1c20' }, horzLines: { color: '#1c1c20' } },
  rightPriceScale: { borderColor: '#2a2a2e' },
  timeScale: { borderColor: '#2a2a2e', timeVisible: false, secondsVisible: false },
  crosshair: { mode: 0 },
};

const chart = LightweightCharts.createChart(chartEl, baseChartOpts);
const candleSeries = chart.addCandlestickSeries({
  upColor: '#4caf50', downColor: '#ef5350',
  borderUpColor: '#4caf50', borderDownColor: '#ef5350',
  wickUpColor: '#4caf50', wickDownColor: '#ef5350',
});

const equityChart = LightweightCharts.createChart(equityEl, baseChartOpts);
const equitySeries = equityChart.addLineSeries({ color: '#4caf50', lineWidth: 2 });

window.addEventListener('resize', () => {
  chart.resize(chartEl.clientWidth, chartEl.clientHeight);
  equityChart.resize(equityEl.clientWidth, equityEl.clientHeight);
});

// =========================================================
// FILE LOAD
// =========================================================
document.getElementById('file-input').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const json = JSON.parse(e.target.result);
      if (!Array.isArray(json)) throw new Error('expected array of bars');
      bars = json.map(c => ({
        open: +c.open, high: +c.high, low: +c.low, close: +c.close,
      }));
      const base = 1577836800; // 2020-01-01
      chartTimes = bars.map((_, i) => base + i * 60);
      const candleData = bars.map((b, i) => ({ time: chartTimes[i], ...b }));
      candleSeries.setData(candleData);
      candleSeries.setMarkers([]);
      clearOverlays();
      equitySeries.setData([]);
      chart.timeScale().fitContent();
      document.getElementById('status').textContent =
        `loaded ${bars.length.toLocaleString()} bars from ${file.name}`;
    } catch (err) {
      document.getElementById('status').textContent = `load error: ${err.message}`;
    }
  };
  reader.readAsText(file);
});

// =========================================================
// STRATEGY — direct port of your Python (1:1)
// =========================================================
function direction(c) {
  if (c.close > c.open) return 1;
  if (c.close < c.open) return -1;
  return 0;
}

function runBacktest(p) {
  const directions = bars.map(direction);
  const equity = [p.scalingEnabled ? p.startingBalance : 0];
  const trades = [];
  const tailGuard = p.tpFill === 'nextopen' ? (p.tpCloseAfter + 3) : (p.tpCloseAfter + 2);

  let i = p.streakSize;
  while (i < bars.length - tailGuard) {
    const streakDir = directions[i - p.streakSize];
    if (streakDir === 0) { i++; continue; }

    let valid = true;
    for (let j = i - p.streakSize; j < i; j++) {
      if (directions[j] !== streakDir) { valid = false; break; }
    }
    if (!valid) { i++; continue; }

    const reversalDir = directions[i];
    if (reversalDir !== -streakDir) { i++; continue; }

    const balanceNow = equity[equity.length - 1];
    const riskThisTrade = p.scalingEnabled
      ? (balanceNow / 100) * p.riskPer100
      : p.flatRisk;
    if (riskThisTrade <= 0) break;

    const rawLots = riskThisTrade / p.fixedSL;
    const lots = Math.max(0.01, Math.min(600, rawLots));

    const entryIdx = i + 1;
    const rawEntry = bars[entryIdx].open;
    const entryPrice = reversalDir === 1 ? rawEntry + p.slippage : rawEntry - p.slippage;
    const slPrice = reversalDir === 1 ? entryPrice - p.fixedSL : entryPrice + p.fixedSL;

    const tpIdx = entryIdx + p.tpCloseAfter;
    let hitSL = false, exitPrice = null, exitIdx = null;
    let mfePoints = 0, maePoints = 0;

    for (let k = entryIdx; k <= tpIdx; k++) {
      const bar = bars[k];
      const fav = reversalDir === 1 ? bar.high - entryPrice : entryPrice - bar.low;
      const adv = reversalDir === 1 ? entryPrice - bar.low : bar.high - entryPrice;
      if (fav > mfePoints) mfePoints = fav;
      if (adv > maePoints) maePoints = adv;

      if (reversalDir === 1) {
        if (bar.open <= slPrice) { exitPrice = bar.open - p.slippage; hitSL = true; exitIdx = k; break; }
        if (bar.low  <= slPrice) { exitPrice = slPrice  - p.slippage; hitSL = true; exitIdx = k; break; }
      } else {
        if (bar.open >= slPrice) { exitPrice = bar.open + p.slippage; hitSL = true; exitIdx = k; break; }
        if (bar.high >= slPrice) { exitPrice = slPrice  + p.slippage; hitSL = true; exitIdx = k; break; }
      }
    }

    if (!hitSL) {
      if (p.tpFill === 'nextopen') {
        const exitBarIdx = tpIdx + 1;
        const rawTp = bars[exitBarIdx].open;
        exitPrice = reversalDir === 1 ? rawTp - p.slippage : rawTp + p.slippage;
        exitIdx = exitBarIdx;
      } else {
        const rawTp = bars[tpIdx].close;
        exitPrice = reversalDir === 1 ? rawTp - p.slippage : rawTp + p.slippage;
        exitIdx = tpIdx;
      }
    }

    const pnlPoints = reversalDir === 1 ? exitPrice - entryPrice : entryPrice - exitPrice;
    const grossPnl = pnlPoints * lots;
    const commCost = lots * p.commission;
    const netPnl = grossPnl - commCost;

    equity.push(equity[equity.length - 1] + netPnl);
    trades.push({
      entryIdx, exitIdx, dir: reversalDir,
      entry: entryPrice, exit: exitPrice, sl: slPrice,
      pnlPoints, netPnl, grossPnl, commission: commCost, lots,
      barsHeld: exitIdx - entryIdx + 1,
      hitSL, mfePoints, maePoints,
      rMultiple: riskThisTrade > 0 ? netPnl / riskThisTrade : 0,
      riskUsed: riskThisTrade,
      balanceAfter: equity[equity.length - 1],
    });
    i++;
  }
  return { trades, equity };
}

// =========================================================
// OVERLAYS / MARKERS / STATS / LIST
// =========================================================
function clearOverlays() {
  if (entryLineSeries) { chart.removeSeries(entryLineSeries); entryLineSeries = null; }
  if (slLineSeries)    { chart.removeSeries(slLineSeries);    slLineSeries = null; }
  if (tradeSegSeries)  { chart.removeSeries(tradeSegSeries);  tradeSegSeries = null; }
}

function applyMarkers(trades) {
  const markers = [];
  for (const t of trades) {
    const isLong = t.dir === 1;
    markers.push({
      time: chartTimes[t.entryIdx],
      position: isLong ? 'belowBar' : 'aboveBar',
      color: isLong ? '#4caf50' : '#ef5350',
      shape: isLong ? 'arrowUp' : 'arrowDown',
      text: isLong ? 'L' : 'S',
    });
    markers.push({
      time: chartTimes[t.exitIdx],
      position: t.netPnl > 0 ? 'aboveBar' : 'belowBar',
      color: t.netPnl > 0 ? '#26c6da' : '#ff9800',
      shape: t.hitSL ? 'square' : 'circle',
      text: (t.netPnl >= 0 ? '+' : '') + t.netPnl.toFixed(0),
    });
  }
  markers.sort((a, b) => a.time - b.time);
  candleSeries.setMarkers(markers);
}

function focusTrade(idx) {
  clearOverlays();
  if (idx < 0 || !result) return;
  const t = result.trades[idx];

  const lineCommon = {
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  };

  entryLineSeries = chart.addLineSeries({
    color: '#42a5f5', lineWidth: 2, lineStyle: 2, ...lineCommon,
  });
  entryLineSeries.setData([
    { time: chartTimes[t.entryIdx], value: t.entry },
    { time: chartTimes[t.exitIdx],  value: t.entry },
  ]);

  slLineSeries = chart.addLineSeries({
    color: '#ef5350', lineWidth: 2, lineStyle: 2, ...lineCommon,
  });
  slLineSeries.setData([
    { time: chartTimes[t.entryIdx], value: t.sl },
    { time: chartTimes[t.exitIdx],  value: t.sl },
  ]);

  tradeSegSeries = chart.addLineSeries({
    color: t.netPnl > 0 ? '#4caf50' : '#ef5350',
    lineWidth: 3, ...lineCommon,
  });
  tradeSegSeries.setData([
    { time: chartTimes[t.entryIdx], value: t.entry },
    { time: chartTimes[t.exitIdx],  value: t.exit },
  ]);

  const pad = 40;
  const fromIdx = Math.max(0, t.entryIdx - pad);
  const toIdx   = Math.min(bars.length - 1, t.exitIdx + pad);
  chart.timeScale().setVisibleRange({
    from: chartTimes[fromIdx], to: chartTimes[toIdx],
  });

  document.querySelectorAll('.trade-row').forEach(r => r.classList.remove('active'));
  const row = document.querySelector(`.trade-row[data-idx="${idx}"]`);
  if (row) { row.classList.add('active'); row.scrollIntoView({ block: 'nearest' }); }
  activeTradeIdx = idx;
}

function renderStats(res) {
  const t = res.trades;
  if (t.length === 0) {
    document.getElementById('stats').innerHTML =
      '<h3>STATS</h3><div class="row"><span>no trades</span><span></span></div>';
    return;
  }
  const wins = t.filter(x => x.netPnl > 0).length;
  const losses = t.length - wins;
  const net = t.reduce((s, x) => s + x.netPnl, 0);
  const grossW = t.filter(x => x.netPnl > 0).reduce((s, x) => s + x.netPnl, 0);
  const grossL = t.filter(x => x.netPnl <= 0).reduce((s, x) => s + Math.abs(x.netPnl), 0);
  const pf = grossL > 0 ? grossW / grossL : 0;
  const wr = wins / t.length * 100;
  const exp = net / t.length;
  const slExits = t.filter(x => x.hitSL).length;
  const longs = t.filter(x => x.dir === 1).length;
  const shorts = t.length - longs;
  const finalBal = res.equity[res.equity.length - 1];

  // max DD
  let peak = res.equity[0], maxDD = 0;
  for (const v of res.equity) {
    if (v > peak) peak = v;
    if (peak - v > maxDD) maxDD = peak - v;
  }

  const rows = [
    ['Trades', t.length],
    ['Wins / Losses', `${wins} / ${losses}`],
    ['Winrate', `${wr.toFixed(2)}%`],
    ['Net PnL', `$${net.toFixed(2)}`],
    ['Profit factor', pf.toFixed(2)],
    ['Expectancy', `$${exp.toFixed(2)}`],
    ['SL / TP exits', `${slExits} / ${t.length - slExits}`],
    ['Long / Short', `${longs} / ${shorts}`],
    ['Max drawdown', `$${maxDD.toFixed(2)}`],
    ['Final balance', `$${finalBal.toFixed(2)}`],
  ];
  document.getElementById('stats').innerHTML =
    '<h3>STATS</h3>' +
    rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
}

function renderTradeList(trades) {
  const wrap = document.getElementById('trade-list');
  wrap.innerHTML = trades.map((t, i) => {
    const dirCls = t.dir === 1 ? 'long' : 'short';
    const pnlCls = t.netPnl > 0 ? 'win' : 'loss';
    return `
      <div class="trade-row" data-idx="${i}">
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="dir ${dirCls}">${t.dir === 1 ? 'L' : 'S'}</span>
          <span>#${i+1}</span>
          <span class="meta">${t.entryIdx}→${t.exitIdx} · ${t.barsHeld}b · ${t.hitSL ? 'SL' : 'TP'}</span>
        </div>
        <span class="pnl ${pnlCls}">${t.netPnl >= 0 ? '+' : ''}${t.netPnl.toFixed(2)}</span>
      </div>`;
  }).join('');
  wrap.querySelectorAll('.trade-row').forEach(row => {
    row.addEventListener('click', () => focusTrade(parseInt(row.dataset.idx)));
  });
}

function renderEquity(res) {
  const base = 1577836800;
  const data = res.equity.map((v, i) => ({ time: base + i * 60, value: v }));
  equitySeries.setData(data);
  equityChart.timeScale().fitContent();
}

// =========================================================
// RUN
// =========================================================
document.getElementById('run').addEventListener('click', () => {
  if (bars.length === 0) {
    document.getElementById('status').textContent = 'load a data file first';
    return;
  }
  const params = {
    streakSize:      +document.getElementById('streak').value,
    tpCloseAfter:    +document.getElementById('tp').value,
    fixedSL:         +document.getElementById('sl').value,
    slippage:        +document.getElementById('slip').value,
    commission:      +document.getElementById('comm').value,
    scalingEnabled:  document.getElementById('mode').value === 'scaling',
    startingBalance: +document.getElementById('start-bal').value,
    riskPer100:      +document.getElementById('risk100').value,
    flatRisk:        +document.getElementById('flat').value,
    tpFill:          document.getElementById('tpfill').value,
  };
  const t0 = performance.now();
  result = runBacktest(params);
  const t1 = performance.now();

  clearOverlays();
  applyMarkers(result.trades);
  renderStats(result);
  renderTradeList(result.trades);
  renderEquity(result);
  chart.timeScale().fitContent();

  document.getElementById('status').textContent =
    `ran in ${(t1-t0).toFixed(0)}ms — ${result.trades.length} trades — click any row to focus that trade`;
});
</script>
</body>
</html>
